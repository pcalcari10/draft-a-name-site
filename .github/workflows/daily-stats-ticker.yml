name: Stats Ticker Update

on:
  schedule:
    # Baseline: once a day at 11:00 UTC, so the file always stays current even
    # outside game windows.
    - cron: '0 11 * * *'

    # Live-game windows, every 15 minutes. Cron is fixed UTC, but NFL kickoffs
    # are in Eastern Time, which shifts between EDT (UTC-4) and EST (UTC-5)
    # when clocks change in early November — these windows are padded wider
    # than the exact kickoff times so they stay accurate across that shift
    # without needing to be edited.

    # Thursday Night Football: ~8:15pm ET kickoff, Thu evening US time lands
    # as Friday 00:00-05:59 UTC.
    - cron: '*/15 0-5 * * 5'

    # Sunday day games: 1:00pm ET earliest kickoff through the late-afternoon
    # window, all within Sunday UTC.
    - cron: '*/15 16-23 * * 0'

    # Sunday Night Football: kicks off Sunday evening US time, lands as
    # Monday 00:00-06:59 UTC.
    - cron: '*/15 0-6 * * 1'

    # Monday Night Football: kicks off Monday evening US time, lands as
    # Tuesday 00:00-06:59 UTC.
    - cron: '*/15 0-6 * * 2'

  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-ticker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build stats ticker
        run: node scripts/build-stats-ticker.js

      - name: Commit and push if stats_ticker.json changed
        run: |
          git config user.name "stats-ticker-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- stats_ticker.json; then
            git add stats_ticker.json
            git commit -m "Update stats ticker data"
            git push
          else
            echo "No changes to commit."
          fi
