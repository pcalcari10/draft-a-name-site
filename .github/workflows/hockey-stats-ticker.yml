name: Hockey Stats Ticker Update

on:
  schedule:
    # NHL games happen most nights of the week rather than specific windows
    # like the NFL, so this just runs a handful of times a day rather than
    # trying to track exact game times: once before the day's games (11:00
    # UTC), and three more times through the evening/night US game window to
    # catch results as they finish (03:00, 06:00, 09:00 UTC covers roughly
    # 10pm-5am ET, when most games wrap up).
    - cron: '0 11 * * *'
    - cron: '0 3 * * *'
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-ticker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build hockey stats ticker (season leaders)
        run: node scripts/build-stats-ticker-hockey.js

      - name: Build hockey stats ticker (this week, fantasy Monday-start)
        run: node scripts/build-weekly-ticker-hockey.js

      - name: Commit and push if stats_ticker_hockey.json changed
        run: |
          git config user.name "stats-ticker-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- stats_ticker_hockey.json; then
            echo "No changes to commit."
            exit 0
          fi
          git add stats_ticker_hockey.json
          git commit -m "Update hockey stats ticker data"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push attempt $i failed, retrying after a short wait..."
            sleep 5
          done
          echo "Failed to push after 5 attempts."
          exit 1
